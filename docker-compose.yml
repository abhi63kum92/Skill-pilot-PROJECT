version: '3.8'

services:
  # ======================================
  # 1. FastAPI Backend Service
  # ======================================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillpilot_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./skillpilot.db
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_in_prod}
    volumes:
      - ./backend:/app
      - /app/venv
    restart: unless-stopped
    networks:
      - skillpilot_network

  # ======================================
  # 2. React (Vite) Frontend Service
  # ======================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillpilot_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - skillpilot_network

networks:
  skillpilot_network:
    driver: bridge
